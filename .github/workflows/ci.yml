name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5" "pytest>=8.3,<9" "ruff>=0.9,<1"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Syntax compile
        run: python -m compileall -q app.py src
